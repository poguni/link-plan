<!doctype html>
<html lang="ko" data-theme="clean" data-view="board">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>링크 플랜</title>
  <link rel="icon" href="data:,">
  <!-- 저장된 테마·뷰를 첫 화면이 그려지기 전에 적용해 깜빡임을 막습니다(자세한 처리는 js/theme.js). -->
  <script>
    try {
      var r = document.documentElement, t = localStorage.getItem('linkplan_theme'), v = localStorage.getItem('linkplan_view');
      if (t === 'clean' || t === 'night' || t === 'pastel') r.dataset.theme = t;
      if (v === 'board' || v === 'link') r.dataset.view = v;
    } catch (e) { /* 저장소를 못 쓰면 기본값(clean·board)을 씁니다. */ }
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/view-board.css">
  <link rel="stylesheet" href="css/view-link.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div id="app"></div>
  <!-- 드래그 앤 드롭: SortableJS (CDN). 프레임워크나 번들러 없이 씁니다. -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js"></script>
  <!-- Supabase 클라이언트(CDN, 공식 설치 방식). window.supabase.createClient 로 js/api.js 가 씁니다. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
